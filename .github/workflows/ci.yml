name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  required-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # version 差分検査で base ブランチと比較するため全履歴が要る
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 依存関係のインストール（PyYAML）
        run: pip install pyyaml

      - name: JSON 構文検証（marketplace.json・plugin.json・hooks.json 等）
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          EXCLUDE_DIRS = {"node_modules", "build", "dist", ".git"}
          bad = []
          for p in pathlib.Path(".").rglob("*.json"):
              if any(part in EXCLUDE_DIRS for part in p.parts):
                  continue
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"OK: JSON {sum(1 for _ in pathlib.Path('.').rglob('*.json'))} 件")
          PY

      - name: "SKILL.md 検査（公式ガイド準拠 — 山括弧禁止・name・キー集合・レイアウト・字数・行数）"
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          import yaml

          # 公式ガイド "The Complete Guide to Building Skills for Claude" の技術要件を機械化する。
          # 機械化していない項目（description の質など）は docs/skill-authoring.md を参照。
          ALLOWED_KEYS = {
              # ガイドの必須・任意フィールド
              "name", "description", "license", "compatibility", "metadata", "allowed-tools",
              # Claude Code 固有（ガイドには出てこないが正当なキー）
              "argument-hint", "disable-model-invocation", "hooks",
          }
          # システムプロンプトに載る＝山括弧を禁止する対象
          # （hooks はシェルのリダイレクト > が正当に現れるうえ、システムプロンプトに載らないので除く）
          PROMPT_KEYS = ("name", "description", "argument-hint", "compatibility", "license", "metadata")
          NAME_RE = re.compile(r"^[a-z0-9]+(-[a-z0-9]+)*$")
          EXCLUDE_PARTS = {"examples", "reimpl", "build", "dist"}

          def has_angle(v):
              """文字列・リスト・辞書を再帰的に走査して < > を探す。"""
              if isinstance(v, str):
                  return "<" in v or ">" in v
              if isinstance(v, dict):
                  return any(has_angle(x) for x in v.values())
              if isinstance(v, list):
                  return any(has_angle(x) for x in v)
              return False

          bad = []
          checked = 0
          for p in sorted(pathlib.Path(".").glob("**/skills/*/SKILL.md")):
              if EXCLUDE_PARTS & set(p.parts):
                  continue
              checked += 1
              text = p.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  bad.append(f"{p}: frontmatter が先頭にない")
                  continue
              end = text.find("\n---", 4)
              if end == -1:
                  bad.append(f"{p}: frontmatter の終端 '---' が見つからない")
                  continue
              try:
                  meta = yaml.safe_load(text[4:end]) or {}
              except Exception as e:
                  bad.append(f"{p}: frontmatter パース失敗: {e}")
                  continue

              # name: 必須・kebab-case・ディレクトリ名と一致・予約語を含まない
              name = meta.get("name")
              if not isinstance(name, str) or not name.strip():
                  bad.append(f"{p}: name が無い（必須）")
              else:
                  if not NAME_RE.match(name):
                      bad.append(f"{p}: name が kebab-case でない: {name!r}")
                  if name != p.parent.name:
                      bad.append(f"{p}: name がディレクトリ名と違う（name={name!r} dir={p.parent.name!r}）")
                  if "claude" in name or "anthropic" in name:
                      bad.append(f"{p}: name に予約語（claude/anthropic）が入っている: {name!r}")

              # description: 必須
              if not isinstance(meta.get("description"), str) or not str(meta.get("description")).strip():
                  bad.append(f"{p}: description が無い（必須）")

              # 未知のキー（打ち間違いが無言で無効化されるのを防ぐ）
              for key in meta:
                  if key not in ALLOWED_KEYS:
                      bad.append(f"{p}: 未知のキー {key!r}（許可: {sorted(ALLOWED_KEYS)}）")

              # 山括弧の禁止（ガイドの security restriction。frontmatter はシステムプロンプトに載る）
              for key in PROMPT_KEYS:
                  if key in meta and has_angle(meta[key]):
                      bad.append(f"{p}: {key} に山括弧 < > がある（禁止）。プレースホルダは [] を使う")

              # argument-hint はクオートしないと [] が YAML リストになり型が変わる
              hint = meta.get("argument-hint")
              if hint is not None and not isinstance(hint, str):
                  bad.append(
                      f"{p}: argument-hint が {type(hint).__name__}（クオート漏れ）。"
                      'ダブルクオートで囲む: argument-hint: "[引数]"'
                  )

              # 字数・行数
              desc_len = len(str(meta.get("description", "")))
              if desc_len > 1536:
                  bad.append(f"{p}: description が1536字超（{desc_len}字）")
              nlines = len(text.splitlines())
              if nlines > 500:
                  bad.append(f"{p}: 本文が500行超（{nlines}行）")

              # レイアウト: スキル直下は SKILL.md のみ（他の .md は references/ へ）
              for q in sorted(p.parent.glob("*.md")):
                  if q.name != "SKILL.md":
                      bad.append(f"{q}: スキル直下に SKILL.md 以外の .md がある。references/ へ移すこと")

              # references/ の死蔵防止。SKILL.md から直接、または他の references/ 経由で
              # 到達できること（分冊が分冊を参照する形も正当な段階的開示なので許す）
              refs = sorted(p.parent.glob("references/*.md"))
              corpus = text + "".join(r.read_text(encoding="utf-8") for r in refs)
              for q in refs:
                  # 自分自身の本文に出てくる名前は参照とみなさない
                  others = text + "".join(
                      r.read_text(encoding="utf-8") for r in refs if r != q
                  )
                  if q.name not in others:
                      bad.append(f"{q}: SKILL.md からも他の references/ からも参照されていない")

          if bad:
              print("\n".join(bad))
              print("\n解説と背景: docs/skill-authoring.md")
              sys.exit(1)
          print(f"OK: SKILL.md {checked} 件")
          PY

      - name: agent frontmatter 検査（name/description/tools/model/color の存在と型）
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          import yaml

          REQUIRED = ("name", "description", "tools", "model", "color")
          OPTIONAL = ("hooks",)   # サブエージェント実行中だけ有効なフック宣言（任意）
          EXCLUDE_PARTS = {"examples", "reimpl", "build", "dist", "node_modules"}
          bad = []
          checked = 0
          for p in sorted(pathlib.Path(".").glob("**/agents/*.md")):
              if EXCLUDE_PARTS & set(p.parts):
                  continue
              checked += 1
              text = p.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  bad.append(f"{p}: frontmatter が先頭にない")
                  continue
              end = text.find("\n---", 4)
              if end == -1:
                  bad.append(f"{p}: frontmatter の終端 '---' が見つからない")
                  continue
              try:
                  meta = yaml.safe_load(text[4:end]) or {}
              except Exception as e:
                  bad.append(f"{p}: frontmatter パース失敗: {e}")
                  continue
              for key in REQUIRED:
                  if key not in meta:
                      bad.append(f"{p}: 必須キー '{key}' がない")
                  elif not isinstance(meta[key], str) or not meta[key].strip():
                      bad.append(f"{p}: '{key}' が空でない文字列でない")
              for key in meta:
                  if key not in REQUIRED + OPTIONAL:
                      bad.append(f"{p}: 未知のキー '{key}'（許可: {REQUIRED + OPTIONAL}）")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"OK: agent {checked} 件")
          PY

      - name: shellcheck（plugins 配下の .sh）
        run: |
          # ubuntu-latest には shellcheck がプリインストールされている。
          # SC2086（未クォート変数）は info 扱いだが実バグ種別なので拾いたい。よって severity=info とし、
          # 唯一の既知の誤検出 SC1003（`tr '\\' '/'` を「単一引用符のエスケープ忘れ」と誤報告する）だけ除外する。
          files=$(find plugins -name '*.sh' | sort)
          echo "対象: $(echo "$files" | wc -l) 件"
          shellcheck --severity=info --exclude=SC1003 $files

      - name: BOM 検査（.ps1 は UTF-8 BOM 必須・.sh は BOM 禁止）
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          BOM = b"\xef\xbb\xbf"
          bad = []
          n_ps1 = n_sh = 0
          for p in sorted(pathlib.Path("plugins").rglob("*.ps1")):
              n_ps1 += 1
              if not p.read_bytes().startswith(BOM):
                  bad.append(f"{p}: UTF-8 BOM がない（PowerShell 5.1 で日本語が文字化けする）")
          for p in sorted(pathlib.Path("plugins").rglob("*.sh")):
              n_sh += 1
              if p.read_bytes().startswith(BOM):
                  bad.append(f"{p}: UTF-8 BOM がある（bash が shebang を認識できなくなる）")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"OK: .ps1 {n_ps1} 件 / .sh {n_sh} 件")
          PY

      - name: plugin.json version 差分検査（規約5 の機械化）
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          base = os.environ["GITHUB_BASE_REF"]
          subprocess.run(["git", "fetch", "--quiet", "origin", base], check=True)
          changed = subprocess.run(
              ["git", "diff", "--name-only", f"origin/{base}...HEAD"],
              capture_output=True, text=True, check=True,
          ).stdout.split()

          # skills/ agents/ hooks/ は既定探索パス＝プラグイン導入で自動配信される（規約5）
          DELIVERED = ("skills/", "agents/", "hooks/")
          need, bumped = set(), set()
          for f in changed:
              parts = f.split("/")
              if len(parts) < 3 or parts[0] != "plugins":
                  continue
              plugin, rest = parts[1], "/".join(parts[2:])
              if rest.startswith(DELIVERED):
                  need.add(plugin)
              if rest == ".claude-plugin/plugin.json":
                  bumped.add(plugin)

          missing = sorted(need - bumped)
          if missing:
              for m in missing:
                  print(f"plugins/{m}: skills/agents/hooks を変更したのに "
                        f".claude-plugin/plugin.json の version を上げていない（規約5）")
              sys.exit(1)
          print(f"OK: version bump が要るプラグイン {len(need)} 件すべて更新済み")
          PY

      - name: 内部リンク切れ検査（Markdown の相対リンク）
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          import urllib.parse

          EXCLUDE_PARTS = {"node_modules", "build", "dist", ".git"}
          bad = []
          checked = 0
          for p in sorted(pathlib.Path(".").rglob("*.md")):
              if EXCLUDE_PARTS & set(p.parts):
                  continue
              checked += 1
              for m in re.finditer(r"\[[^\]]*\]\(([^)]+)\)", p.read_text(encoding="utf-8")):
                  target = m.group(1).strip().split()[0]
                  if target.startswith(("http://", "https://", "mailto:", "#", "<")):
                      continue
                  path = urllib.parse.unquote(target.split("#")[0])
                  if not path:
                      continue
                  if not (p.parent / path).exists():
                      bad.append(f"{p}: リンク先が存在しない -> {target}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print(f"OK: Markdown {checked} 件の相対リンク")
          PY

  plugin-validate:
    # claude CLI が使える環境でのみ意味を持つ任意チェック。CI ランナーに未導入でも
    # required-checks はブロックしない（ローカルでの `claude plugin validate` 実行を必須完了条件とする）。
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: claude CLI のインストールを試行
        run: npm install -g @anthropic-ai/claude-code
      - name: 5プラグイン + marketplace を検証
        run: |
          for p in plugins/*/; do
            claude plugin validate "$p"
          done
          claude plugin validate .
